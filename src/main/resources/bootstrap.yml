spring:
  application:
    name: auth-service

  profiles:
    active: dev

  config:
    import: "optional:file:./vault-credentials.yml"

  cloud:
    config:
      uri: http://localhost:8090

    vault:
      uri: http://localhost:8091
      authentication: APPROLE

      kv:
        enabled: true
        backend: secret
        kv-version: 2
        default-context: ""
        application-name: arya-banking/auth-service
        profile-separator: /