spring:
  application:
    name: auth-service

  profiles:
    active: dev

  config:
    import: vault://

  cloud:
    config:
      uri: http://localhost:8090

    vault:
      uri: http://localhost:8091
      authentication: APPROLE

      app-role:
        role-id: 34118030-fff1-694b-b755-34d89f17128f
        secret-id: f098a86b-7fec-2524-d80f-03603c7e93f5

      kv:
        enabled: true
        backend: secret
        default-context: ""
        application-name: arya-banking/auth-service
        profile-separator: /